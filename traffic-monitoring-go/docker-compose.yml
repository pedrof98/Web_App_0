
services:
  db-go:
    image: postgres:15
    container_name: traffic_db_go
    environment:
      - POSTGRES_USER=go_user
      - POSTGRES_PASSWORD=go_pass
      - POSTGRES_DB=go_db
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=pg_stat_statements
    ports:
      - "5420:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - siem-network
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB


  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: traffic_app_go
    ports:
      - "8080:8080"
      - "5001:5001"
      - "5002:5002"
    depends_on:
      - db-go
      - elasticsearch
    environment:
      - DSN=host=db-go user=go_user password=go_pass dbname=go_db port=5432 sslmode=disable TimeZone=UTC
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - siem-network
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./
        target: /app
        consistency: cached
      - ./config:/app/config:ro


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=siem-es-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - siem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - siem-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 30s
      timeout: 10s
      retries: 5

  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: siem_data_generator
    depends_on:
      - app
    environment:
      - SIEM_API_URL=http://app:8080
      - EVENTS_PER_MINUTE=100
      - ENABLE_ATTACK_SIMULATION=true
      - API_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - siem-network
    restart: unless-stopped


  v2x-simulator:
    build:
      context: ./v2x-simulator
      dockerfile: Dockerfile
    container_name: v2x_simulator
    depends_on:
      - app
    environment:
      - DSRC_PORT=5001
      - CV2X_PORT=5002
      - HOST=app
      - INTERVAL=500
      - API_PORT=8081  
    ports:
      - "8081:8081"
    volumes:
      - "./datasets:/app/datasets"
    networks:
      - siem-network
    restart: unless-stopped

networks:
  siem-network:
    driver: bridge

volumes:
  db_data:
  elasticsearch_data: